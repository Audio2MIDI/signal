# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run test:merge-security
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run build:app
      - run: npm test
      - run: npm ci --prefix electron
      - run: npm audit --prefix electron --audit-level=low
      - run: npm ci --prefix electron/scripts/generate-appx-manifest
      - run: npm audit --prefix electron/scripts/generate-appx-manifest --audit-level=low
      - run: npm ci --prefix electron/scripts/generate-ico
      - run: npm audit --prefix electron/scripts/generate-ico --audit-level=low
      - run: npm run build --prefix electron
      - run: npm run build:electron
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - run: xvfb-run -a npm run test:smoke --prefix electron
